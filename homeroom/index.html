<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>학급일지</title>
<meta name="theme-color" content="#2f8f6b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="학급일지">
<style>
:root{
  --bg:#f4f7f6; --panel:#ffffff; --ink:#1c2b27; --muted:#62736e;
  --line:#d9e3e0; --line2:#edf3f1; --accent:#2f8f6b; --accent-soft:#e6f4ee;
  --danger:#c94550; --warn:#b7791f; --info:#3b6fd6; --violet:#7a52c7;
  --shadow:0 2px 5px rgba(30,60,50,.06), 0 10px 28px rgba(30,60,50,.05);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1916; --panel:#16231f; --ink:#e8f3ef; --muted:#9bb2aa;
    --line:#2a3b36; --line2:#1d2c28; --accent:#5cc79c; --accent-soft:#1f3a31;
    --danger:#ef7b84; --warn:#e3a94a; --info:#86a8ff; --violet:#b296ef;
    --shadow:0 2px 6px rgba(0,0,0,.34), 0 10px 28px rgba(0,0,0,.2);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1916; --panel:#16231f; --ink:#e8f3ef; --muted:#9bb2aa;
  --line:#2a3b36; --line2:#1d2c28; --accent:#5cc79c; --accent-soft:#1f3a31;
  --danger:#ef7b84; --warn:#e3a94a; --info:#86a8ff; --violet:#b296ef;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}

.account-controls{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:5px 16px;min-height:34px;font-size:12px;background:var(--panel);border-bottom:1px solid var(--line2)}
#cloudAccount{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.topbar{
  position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.brand b{display:block;font-size:16px;letter-spacing:-.3px}
.brand small{display:block;color:var(--muted);font-size:11.5px}
.tabs{display:flex;gap:4px;background:var(--line2);padding:3px;border-radius:10px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:7px 12px;border-radius:8px;font-size:13.5px;color:var(--muted);font-weight:700;white-space:nowrap;flex:none;display:flex;align-items:center;gap:9px}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.tabs button svg{width:17px;height:17px;flex:none;display:none}
#saveState{font-size:11.5px;color:var(--muted);min-width:52px;text-align:right;margin-left:auto}
#saveState.bad{color:var(--danger);font-weight:800}
/* 넓은 화면: 왼쪽 세로 탭 */
@media(min-width:900px){
  body{padding-left:208px}
  .topbar{position:fixed;top:0;bottom:0;left:0;width:208px;flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:0;
    border-bottom:0;border-right:1px solid var(--line);padding:18px 12px 14px;overflow-y:auto}
  .brand{padding:0 6px 16px;border-bottom:1px solid var(--line2);margin-bottom:12px}
  .tabs{flex-direction:column;background:none;padding:0;gap:2px;overflow:visible}
  .tabs button{padding:10px 12px;font-size:14.5px;border-radius:10px;width:100%;text-align:left}
  .tabs button svg{display:block;opacity:.75}
  .tabs button:hover{background:var(--line2);color:var(--ink)}
  .tabs button.on{background:var(--accent-soft);color:var(--accent);box-shadow:none}
  .tabs button.on svg{opacity:1}
  .tabs .sep{height:1px;background:var(--line2);margin:8px 4px}
  #saveState{margin:auto 0 0;padding:12px 8px 0;text-align:left}
}
/* 좁은 화면: 왼쪽 아이콘 탭 */
@media(max-width:899px){
  body{padding-left:68px}
  .topbar{position:fixed;top:0;bottom:0;left:0;width:68px;flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:0;
    border-bottom:0;border-right:1px solid var(--line);padding:10px 6px calc(10px + env(safe-area-inset-bottom));overflow-y:auto}
  .brand{justify-content:center;padding-bottom:10px;border-bottom:1px solid var(--line2);margin-bottom:8px}
  .brand > div:last-child{display:none}
  .tabs{flex-direction:column;background:none;padding:0;gap:2px;overflow:visible}
  .tabs button{flex-direction:column;gap:3px;padding:8px 2px;font-size:10.5px;width:100%;border-radius:10px}
  .tabs button svg{display:block;width:20px;height:20px}
  .tabs button.on{background:var(--accent-soft);color:var(--accent);box-shadow:none}
  .tabs .sep{height:1px;background:var(--line2);margin:6px 4px}
  #saveState{margin:auto 0 0;padding-top:8px;text-align:center;font-size:10px;min-width:0}
  main{padding:12px}
}
.pagehead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pagehead h2{font-size:21px;letter-spacing:-.4px;margin-right:6px}
.pagehead .sp{flex:1}
.pagehead #memoQ{width:200px}
.sec{font-size:16px;margin:22px 0 10px}
.sidelayout{display:grid;grid-template-columns:240px 1fr;gap:14px;align-items:start}
@media(max-width:760px){.sidelayout{grid-template-columns:1fr}}
.sidelist{display:flex;flex-direction:column;gap:2px;max-height:72vh;overflow:auto;padding:8px}
.sidelist button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;display:flex;flex-direction:column}
.sidelist button b{font-size:13.5px}
.sidelist button small{font-size:11.5px;color:var(--muted)}
.sidelist button.on{background:var(--accent-soft)}
.sidelist button.on b{color:var(--accent)}
@media(max-width:760px){.sidelist{max-height:240px}}
.crit{background:var(--line2);border-radius:8px;padding:8px 10px;margin-top:10px;white-space:pre-wrap}
table.evt td.enm{width:90px;font-weight:700}
table.evt td.lv{width:1%;white-space:nowrap}
table.evt td.p{width:46px}
.budsum{display:grid;grid-template-columns:220px 1fr 1fr;gap:14px;align-items:end}
@media(max-width:640px){.budsum{grid-template-columns:1fr 1fr}.budsum label{grid-column:1/-1}}
.stat small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.stat b{font-size:22px;letter-spacing:-.5px}
.stat b.neg{color:var(--danger)} .stat b.pos{color:var(--accent)}
.bar{height:10px;border-radius:999px;background:var(--line2);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar i.over{background:var(--danger)}
.budadd{display:grid;grid-template-columns:150px 120px 1fr 130px 1fr auto;gap:8px}
@media(max-width:860px){.budadd{grid-template-columns:1fr 1fr}.budadd #bItem,.budadd #bNote,.budadd .btn{grid-column:1/-1}.budadd .btn{justify-content:center}}
table.budt td.amt,table.budt th.amt{text-align:right;white-space:nowrap}
table.budt td.x{width:60px;text-align:right}
table.budt tr.tot td{border-top:2px solid var(--line);border-bottom:0}
.memogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.memogrid .card + .card{margin-top:0}
.memo{display:flex;flex-direction:column;gap:8px}
.memo.pin{border-color:var(--accent)}
.memo .mt{flex:1;font-weight:800;border-color:transparent;padding-left:2px}
.memo .mt:hover{border-color:var(--line)}
.memo textarea{min-height:120px}
table.chk-t{border-collapse:collapse;min-width:100%}
table.chk-t th,table.chk-t td{border:1px solid var(--line);padding:3px 4px;text-align:center;vertical-align:middle}
table.chk-t thead th{background:var(--line2)}
table.chk-t th.no,table.chk-t td.no{width:64px}
table.chk-t th.nm,table.chk-t td.nm{width:120px;text-align:left;position:sticky;left:0;background:var(--panel);z-index:1}
table.chk-t thead th.nm{background:var(--line2)}
table.chk-t td.no input,table.chk-t td.nm input{width:100%;border-color:transparent;padding:5px 6px}
table.chk-t td.no input:hover,table.chk-t td.nm input:hover{border-color:var(--line)}
table.chk-t th.ck,table.chk-t td.ck{min-width:96px}
table.chk-t .colh{display:flex;align-items:center;gap:2px}
table.chk-t .colh input{flex:1;width:100%;min-width:64px;text-align:center;font-weight:700;border-color:transparent;background:transparent;padding:5px 4px}
table.chk-t .colh input:hover{border-color:var(--line);background:var(--panel)}
table.chk-t .colh .btn{padding:2px 5px}
table.chk-t input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
table.chk-t tbody tr:hover td{background:var(--accent-soft)}
table.chk-t tfoot td{font-size:12.5px;font-weight:700;color:var(--muted)}
@media print{table.chk-t th.nm,table.chk-t td.nm{position:static}}
table.roster td.nm{width:140px} table.roster td.ph{width:170px}

main{max-width:1180px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card + .card{margin-top:14px}
.card h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .muted{font-weight:500;font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2 > .card + .card{margin-top:0}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.btn{white-space:nowrap;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 12px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{opacity:.9;color:#fff}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
input[type=text],input[type=date],input[type=number],input[type=month],select,textarea{
  border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 9px;font-size:14px;min-width:0
}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);border-color:var(--accent)}
textarea{width:100%;min-height:76px;resize:vertical;line-height:1.6;field-sizing:content}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
label.f input,label.f select{color:var(--ink);font-weight:400}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13.5px}

.login-welcome{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;padding:20px;margin-bottom:16px;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:var(--r);background:var(--accent-soft)}
.login-welcome h2{font-size:18px;margin-bottom:4px}
.login-welcome p{font-size:13px;color:var(--muted)}
@media(max-width:560px){.login-welcome .btn{width:100%;justify-content:center}}

/* 일지 */
.daybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.daybar h2{font-size:21px;letter-spacing:-.4px;margin-right:auto}
@media(max-width:640px){.daybar h2{width:100%}}
.daybar h2 .dow-0{color:var(--danger)} .daybar h2 .dow-6{color:var(--info)}
.daymeta{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:end}
@media(max-width:640px){.daymeta{grid-template-columns:1fr 1fr}.daymeta .f:nth-child(2){grid-column:1/-1;order:3}}
.attsum{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pill{border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;background:var(--line2);color:var(--muted)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.t-결석{color:var(--danger);background:color-mix(in srgb,var(--danger) 13%,transparent)}
.pill.t-지각{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.pill.t-조퇴{color:var(--info);background:color-mix(in srgb,var(--info) 13%,transparent)}
.pill.t-결과{color:var(--violet);background:color-mix(in srgb,var(--violet) 14%,transparent)}
.pill.t-출석인정{color:var(--accent);background:var(--accent-soft)}
.stugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.stu{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:7px 6px;text-align:left;min-height:52px;display:flex;flex-direction:column;gap:2px}
.stu b{font-size:13.5px}
.stu small{font-size:11px;color:var(--muted)}
.stu:hover{border-color:var(--accent)}
.stu.has{border-width:2px}
.stu.t-결석{border-color:var(--danger)} .stu.t-결석 small{color:var(--danger);font-weight:700}
.stu.t-지각{border-color:var(--warn)} .stu.t-지각 small{color:var(--warn);font-weight:700}
.stu.t-조퇴{border-color:var(--info)} .stu.t-조퇴 small{color:var(--info);font-weight:700}
.stu.t-결과{border-color:var(--violet)} .stu.t-결과 small{color:var(--violet);font-weight:700}
.stu.t-출석인정{border-color:var(--accent)} .stu.t-출석인정 small{color:var(--accent);font-weight:700}
table.tt{width:100%;border-collapse:collapse}
table.tt th,table.tt td{border-bottom:1px solid var(--line2);padding:5px 4px;text-align:left;vertical-align:middle}
table.tt th{font-size:12px;color:var(--muted);font-weight:700}
table.tt input{width:100%}
table.tt td.p{width:46px;font-weight:800;color:var(--muted);text-align:center}
table.tt td.s{width:120px}
.reclist{list-style:none;display:flex;flex-direction:column;gap:6px}
.reclist li{border:1px solid var(--line2);border-radius:10px;padding:8px 10px;display:flex;gap:10px;align-items:flex-start}
.reclist li .txt{flex:1;white-space:pre-wrap;font-size:14px}
.reclist li .meta{font-size:12px;color:var(--muted);white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;background:var(--line2);color:var(--muted);margin-right:4px}
.addrec{display:grid;grid-template-columns:140px 110px 1fr auto;gap:8px;margin-top:10px}
.addrec.wide{grid-template-columns:150px 110px 1fr auto}
@media(max-width:640px){.addrec,.addrec.wide{grid-template-columns:1fr 1fr}.addrec input[type=text]{grid-column:1/-1}.addrec .btn{grid-column:1/-1;justify-content:center}}

/* 달력 */
.monthbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.monthbar h2{font-size:20px;min-width:140px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .hd{text-align:center;font-size:12px;font-weight:800;color:var(--muted);padding:2px}
.cal .hd:first-child{color:var(--danger)} .cal .hd:last-child{color:var(--info)}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:96px;padding:5px 6px;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cell:hover{border-color:var(--accent)}
.cell.blank{background:transparent;border:0;pointer-events:none}
.cell.today{outline:2px solid var(--accent);outline-offset:-1px}
.cell .n{font-weight:800;font-size:13px}
.cell.d0 .n,.cell.hol .n{color:var(--danger)} .cell.d6 .n{color:var(--info)}
.cell.hol{background:color-mix(in srgb,var(--danger) 6%,var(--panel))}
.cell .ev{font-size:11.5px;font-weight:700;color:var(--accent);line-height:1.3}
.cell.hol .ev{color:var(--danger)}
.cell .ab{font-size:11px;color:var(--danger);font-weight:700}
.cell .memo{font-size:11px;color:var(--muted);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media(max-width:640px){.cell{min-height:64px;padding:3px 4px}.cell .memo{display:none}.cal{gap:3px}}

/* 출결부 */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.att{border-collapse:collapse;font-size:12px;min-width:100%}
table.att th,table.att td{border:1px solid var(--line);padding:3px 2px;text-align:center;white-space:nowrap}
table.att thead th{background:var(--line2);font-weight:700;position:sticky;top:0}
table.att td.nm,table.att th.nm{text-align:left;padding:3px 6px;position:sticky;left:0;background:var(--panel);z-index:1}
table.att thead th.nm{background:var(--line2);z-index:2}
table.att td.c{min-width:28px;cursor:pointer}
table.att td.c:hover{background:var(--accent-soft)}
table.att td.c.hol,table.att th.hol{background:color-mix(in srgb,var(--danger) 8%,transparent);color:var(--danger)}
table.att td.c b{font-weight:800}
table.att .t-결석{color:var(--danger)} table.att .t-지각{color:var(--warn)} table.att .t-조퇴{color:var(--info)} table.att .t-결과{color:var(--violet)} table.att .t-출석인정{color:var(--accent)}
table.att td.sum{font-weight:700;min-width:30px}
table.att th.grp{border-left:2px solid var(--muted)}
table.att td.grp{border-left:2px solid var(--muted)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}

/* 학생 */
.stulayout{display:grid;grid-template-columns:220px 1fr;gap:14px;align-items:start}
@media(max-width:760px){.stulayout{grid-template-columns:1fr}}
.stulist{display:flex;flex-direction:column;gap:2px;max-height:70vh;overflow:auto}
@media(max-width:760px){.stulist{flex-direction:row;flex-wrap:wrap;max-height:none}}
.stulist button{border:0;background:none;text-align:left;padding:7px 10px;border-radius:8px;font-size:14px;display:flex;gap:8px}
.stulist button span{color:var(--muted);min-width:20px}
.stulist button.on{background:var(--accent-soft);color:var(--accent);font-weight:800}
table.sumt{border-collapse:collapse;font-size:13px}
table.sumt th,table.sumt td{border:1px solid var(--line);padding:4px 10px;text-align:center}
table.sumt th{background:var(--line2)}

/* 설정 */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
table.roster{width:100%;border-collapse:collapse}
table.roster th,table.roster td{border-bottom:1px solid var(--line2);padding:4px;text-align:left}
table.roster th{font-size:12px;color:var(--muted)}
table.roster input,table.roster select{width:100%}
table.roster td.no{width:70px} table.roster td.g{width:80px} table.roster td.x{width:40px}
table.base{border-collapse:collapse;width:100%}
table.base th,table.base td{border:1px solid var(--line2);padding:3px;text-align:center}
table.base th{font-size:12px;color:var(--muted)}
table.base input{width:100%;text-align:center;padding:6px 4px}

/* 모달 */
.overlay{position:fixed;inset:0;background:rgba(10,20,18,.45);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--panel);border-radius:16px;max-width:440px;width:100%;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
.modal h3{font-size:17px;margin-bottom:4px}
.modal .grp{margin-top:12px}
.modal .grp > div{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal input[type=text]{width:100%}

#printHead{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;color:#000;font-size:12px}
  .noprint,.account-controls,.topbar,.login-welcome,#cloudPanel,.daybar .btn,.daybar input,.monthbar .btn,.addrec,.reclist .btn,.stulist{display:none!important}
  main{padding:0;max-width:none}
  .card{box-shadow:none;border:1px solid #999;break-inside:avoid;padding:10px}
  #printHead{display:block;font-size:13px;margin-bottom:8px;font-weight:700}
  input,select,textarea{border:0!important;padding:0!important;background:none!important;resize:none}
  textarea{min-height:0}
  .stulayout{grid-template-columns:1fr}
  .tablewrap{overflow:visible}
  table.att{font-size:9px}
  table.att th.nm,table.att td.nm{position:static}
  .print-landscape{}
}
</style>
</head>
<body>

<div class="account-controls noprint" aria-label="계정">
  <span id="cloudAccount">게스트</span>
  <button class="btn sm" id="cloudLogin" disabled>Google 로그인</button>
  <button class="btn sm" id="cloudLogout" hidden>로그아웃</button>
</div>
<header class="topbar">
  <div class="brand">
    <div class="mark" aria-hidden="true">학</div>
    <div><b>학급일지</b><small id="classLabel">학급 정보를 설정하세요</small></div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-view="att" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg><span>출결</span></button>
    <button data-view="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h12l4 4v12H4z"/><path d="M8 12h8M8 16h6M8 8h4"/></svg><span>일지</span></button>
    <button data-view="roster"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21 20c0-2.6-1.6-4.8-4-5.6"/></svg><span>명렬표</span></button>
    <button data-view="eval"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg><span>평가</span></button>
    <button data-view="rec"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2z"/><path d="M8 7h6M8 11h6"/></svg><span>누가기록</span></button>
    <button data-view="budget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 14.5h2"/></svg><span>예산사용</span></button>
    <button data-view="memo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14v12l-6 6H5z"/><path d="M13 21v-6h6"/></svg><span>메모</span></button>
    <button data-view="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>달력</span></button>
    <div class="sep"></div>
    <button data-view="setup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>설정</span></button>
  </nav>
  <span id="saveState">저장됨</span>
</header>

<section id="cloudPanel" class="card noprint" style="max-width:1148px;margin:14px max(16px,calc((100% - 1148px)/2))" aria-label="저장 문제 알림" hidden>
  <div class="row">
    <span id="cloudStatus" role="status" aria-live="polite">이 기기에만 저장 중</span>
    <button class="btn sm" id="cloudRetry" hidden>동기화 다시 시도</button>
  </div>
  <p id="cloudHelp" class="muted small" style="margin-top:6px" hidden></p>
  <script>
  if(location.protocol === 'file:'){
    document.getElementById('cloudPanel').hidden=false;
    document.getElementById('cloudHelp').hidden=false;
    document.getElementById('cloudHelp').textContent='파일을 직접 열면 로그인할 수 없습니다. 인터넷 주소로 열어야 Google 로그인과 동기화가 됩니다. 지금은 이 브라우저에만 저장됩니다.';
    document.getElementById('cloudLogin').hidden = true;
  }
  </script>
  <div id="cloudConflict" hidden style="margin-top:10px">
    <p class="small">다른 기기에서 수정한 내용이 있습니다. 현재 입력을 백업한 다음 온라인 일지를 불러와 주세요.</p>
    <div class="row" style="margin-top:8px">
      <button class="btn sm" id="cloudBackup">현재 입력 백업</button>
      <button class="btn sm" id="cloudReload">온라인 일지 불러오기</button>
    </div>
  </div>
</section>

<main>
  <section id="loginWelcome" class="login-welcome noprint" aria-labelledby="loginWelcomeTitle">
    <div><h2 id="loginWelcomeTitle">먼저 구글로 로그인해서 이용하세요</h2>
      <p>로그인하면 내 계정에 학급일지가 저장되어 PC와 휴대폰에서 이어서 쓸 수 있어요. 다른 선생님은 내 일지를 볼 수 없습니다.</p></div>

  </section>
  <div id="printHead"></div>

  <section id="view-att"></section>
  <section id="view-log" hidden></section>
  <section id="view-roster" hidden></section>
  <section id="view-eval" hidden></section>
  <section id="view-rec" hidden></section>
  <section id="view-budget" hidden></section>
  <section id="view-memo" hidden></section>
  <section id="view-cal" hidden></section>
  <section id="view-setup" hidden></section>
</main>

<div id="modalRoot"></div>

<script>
const APP_VER = '2026.11.03d';
const LSKEY = 'homeroom-journal-v1';
const WEEK = ['일','월','화','수','목','금','토'];
const TYPES = ['결석','지각','조퇴','결과'];
const REASONS = ['질병','미인정','기타'];
const CATS = ['학습','생활','교우관계','상담','학부모','건강','칭찬','기타'];
const SHORT = {결석:'결',지각:'지',조퇴:'조',결과:'과'};
const WEATHER = ['','맑음','구름 조금','흐림','비','눈','바람','미세먼지'];

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate()+n); return ymd(d); };
const TODAY = ymd(new Date());
const schoolYearOf = s => { const d = parseD(s); return d.getMonth() >= 2 ? d.getFullYear() : d.getFullYear()-1; };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/-/g,'').slice(0,12);
const korDate = s => { const d = parseD(s); return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`; };
const shortDate = s => { const d = parseD(s); return `${d.getMonth()+1}/${d.getDate()}(${WEEK[d.getDay()]})`; };

function defState(){
  return {
    version:1,
    info:{year:schoolYearOf(TODAY), school:'', grade:'', cls:'', teacher:''},
    periods:6,
    students:[],
    timetable:{1:[],2:[],3:[],4:[],5:[]},
    days:{},
    records:[],
    evals:[],
    budget:{total:0, items:[]},
    memos:[],
    checks:{cols:Array.from({length:5}, () => ({id:uid(), title:''})), marks:{}}
  };
}
function normalize(raw){
  const d = defState();
  if(!raw || typeof raw !== 'object') return d;
  const s = Object.assign(d, raw);
  s.info = Object.assign(defState().info, raw.info || {});
  s.timetable = Object.assign(defState().timetable, raw.timetable || {});
  s.students = Array.isArray(raw.students) ? raw.students.filter(x => x && x.id) : [];
  s.records = Array.isArray(raw.records) ? raw.records.filter(x => x && x.id) : [];
  s.days = raw.days && typeof raw.days === 'object' ? raw.days : {};
  s.evals = Array.isArray(raw.evals) ? raw.evals.filter(x => x && x.id) : [];
  s.budget = {total:Number(raw.budget?.total) || 0, items:Array.isArray(raw.budget?.items) ? raw.budget.items.filter(x => x && x.id) : []};
  s.memos = Array.isArray(raw.memos) ? raw.memos.filter(x => x && x.id) : [];
  s.checks = raw.checks && Array.isArray(raw.checks.cols) ? {cols:raw.checks.cols.filter(x => x && x.id), marks:raw.checks.marks && typeof raw.checks.marks === 'object' ? raw.checks.marks : {}} : defState().checks;
  s.periods = Math.min(9, Math.max(1, Number(raw.periods) || 6));
  return s;
}
function readPayload(payload){
  if(!payload) return defState();
  try{
    const o = JSON.parse(payload);
    return normalize(o && o.app === 'homeroom' ? o.state : o);
  }catch(e){ return defState(); }
}
let STORAGE = 'ok';
function load(){
  try{ return readPayload(localStorage.getItem(LSKEY)); }
  catch(e){ STORAGE = 'blocked'; return defState(); }
}
let state = load();

/* ---------- 저장 ---------- */
function pruneDays(){
  for(const k of Object.keys(state.days)){
    const d = state.days[k];
    if(d.att) for(const sid of Object.keys(d.att)) if(!d.att[sid]) delete d.att[sid];
    if(d.att && !Object.keys(d.att).length) delete d.att;
    if(d.periods && !d.periods.some(p => p && (p.subj || p.content))) delete d.periods;
    for(const f of Object.keys(d)) if(d[f] === '' || d[f] === false) delete d[f];
    if(!Object.keys(d).length) delete state.days[k];
  }
}
function journalPayload(){ pruneDays(); return JSON.stringify({app:'homeroom', version:1, state}); }
let saveTimer = null;
function setSaveState(txt, bad){ const el = $('#saveState'); el.textContent = txt; el.classList.toggle('bad', !!bad); }
function save(){
  if(window.HRCloud?.active){ window.HRCloud.save(journalPayload()); return; }
  clearTimeout(saveTimer);
  if(STORAGE !== 'ok'){ setSaveState('저장 안 됨', true); return; }
  setSaveState('…');
  saveTimer = setTimeout(() => {
    try{ localStorage.setItem(LSKEY, journalPayload()); setSaveState('저장됨'); }
    catch(e){ setSaveState('저장 안 됨', true); }
  }, 250);
}
function flush(){
  if(window.HRCloud?.active){ window.HRCloud.save(journalPayload()); return; }
  if(STORAGE !== 'ok') return;
  clearTimeout(saveTimer);
  try{ localStorage.setItem(LSKEY, journalPayload()); }catch(e){}
}
window.addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', () => { if(document.hidden) flush(); });

/* ---------- 자료 도우미 ---------- */
const dayOf = d => state.days[d] || {};
const dayW = d => state.days[d] || (state.days[d] = {});
const students = () => [...state.students].sort((a,b) => (Number(a.no)||999) - (Number(b.no)||999) || String(a.name).localeCompare(b.name,'ko'));
const stuById = id => state.students.find(s => s.id === id);
const stuLabel = s => s ? `${s.no ? s.no+'. ' : ''}${s.name || '(이름 없음)'}` : '(삭제된 학생)';
function attCode(a){
  if(!a) return '';
  if(a.type === '출석인정') return '인';
  return (a.reason || '기타')[0] + SHORT[a.type];
}
function attText(a){
  if(!a) return '출석';
  if(a.type === '출석인정') return '출석인정';
  return `${a.reason || '기타'}${a.type}`;
}
function baseSubjects(date){
  const dow = parseD(date).getDay();
  return state.timetable[dow] || [];
}
function inRange(d, from, to){ return d >= from && d <= to; }
function syRange(year){ return [`${year}-03-01`, `${year+1}-02-31`]; }
/* sid → {'결석|질병':n, ..., '출석인정':n} */
function attStats(from, to){
  const out = {};
  for(const [d, day] of Object.entries(state.days)){
    if(!day.att || !inRange(d, from, to)) continue;
    for(const [sid, a] of Object.entries(day.att)){
      if(!a) continue;
      const k = a.type === '출석인정' ? '출석인정' : `${a.type}|${a.reason || '기타'}`;
      (out[sid] ||= {})[k] = (out[sid][k] || 0) + 1;
      out[sid][a.type] = (out[sid][a.type] || 0) + 1;
    }
  }
  return out;
}
function updateClassLabel(){
  const i = state.info;
  const parts = [];
  if(i.school) parts.push(i.school);
  if(i.grade || i.cls) parts.push(`${i.grade || '?'}학년 ${i.cls || '?'}반`);
  $('#classLabel').textContent = parts.length ? parts.join(' ') : '학급 정보를 설정하세요';
}
function headline(){
  const i = state.info;
  return `${i.year}학년도 ${i.school || ''} ${i.grade || ''}${i.grade ? '학년 ' : ''}${i.cls || ''}${i.cls ? '반' : ''}${i.teacher ? ' · 담임 ' + i.teacher : ''}`.replace(/\s+/g,' ').trim();
}

/* ---------- 화면 전환 ---------- */
let view = 'att';
let attDate = TODAY;
let logDate = TODAY;
let calMonth = TODAY.slice(0,7);
let attMonth = TODAY.slice(0,7);
let curStu = '*';
function show(v){
  view = v;
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  $$('main > section[id^="view-"]').forEach(s => s.hidden = s.id !== 'view-' + v);
  render();
  window.scrollTo(0,0);
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button[data-view]'); if(b) show(b.dataset.view); });
function render(){
  updateClassLabel();
  ({att:renderAtt, log:renderLog, roster:renderRoster, eval:renderEval, rec:renderRec, budget:renderBudget, memo:renderMemo, cal:renderCal, setup:renderSetup})[view]();
}

/* ---------- 모달 ---------- */
function openModal(html, onMount){
  const root = $('#modalRoot');
  root.innerHTML = `<div class="overlay"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const ov = root.firstElementChild;
  ov.addEventListener('click', e => { if(e.target === ov) closeModal(); });
  onMount?.(ov.firstElementChild);
  ov.querySelector('[autofocus]')?.focus();
}
function closeModal(){ $('#modalRoot').innerHTML = ''; }
document.addEventListener('keydown', e => { if(e.key === 'Escape' && $('#modalRoot').children.length) closeModal(); });

function openAtt(date, sid){
  const s = stuById(sid); if(!s) return;
  const cur = dayOf(date).att?.[sid];
  let type = cur?.type || '', reason = cur?.reason || '질병';
  openModal(`
    <h3>${esc(stuLabel(s))}</h3>
    <div class="muted small">${esc(korDate(date))} (${WEEK[parseD(date).getDay()]}) 출결</div>
    <div class="grp"><div>구분</div><div class="row" id="mType">
      <button class="btn" data-t="">출석</button>
      ${TYPES.map(t => `<button class="btn" data-t="${t}">${t}</button>`).join('')}
      <button class="btn" data-t="출석인정">출석인정</button>
    </div></div>
    <div class="grp" id="mReasonWrap"><div>사유 구분</div><div class="row" id="mReason">
      ${REASONS.map(r => `<button class="btn" data-r="${r}">${r}</button>`).join('')}
    </div></div>
    <div class="grp"><div>사유·메모 <span class="muted">(예: 감기, 체험학습, 병원 진료)</span></div>
      <input type="text" id="mNote" value="${esc(cur?.note || '')}" maxlength="200"></div>
    <div class="acts"><button class="btn ghost" data-close>취소</button><button class="btn primary" id="mSave" autofocus>저장</button></div>`,
  m => {
    const paint = () => {
      $$('#mType button', m).forEach(b => b.classList.toggle('on', b.dataset.t === type));
      $$('#mReason button', m).forEach(b => b.classList.toggle('on', b.dataset.r === reason));
      $('#mReasonWrap', m).hidden = !type || type === '출석인정';
    };
    paint();
    $('#mType', m).onclick = e => { const b = e.target.closest('button'); if(b){ type = b.dataset.t; paint(); } };
    $('#mReason', m).onclick = e => { const b = e.target.closest('button'); if(b){ reason = b.dataset.r; paint(); } };
    $('[data-close]', m).onclick = closeModal;
    $('#mSave', m).onclick = () => {
      const day = dayW(date); day.att ||= {};
      if(!type) delete day.att[sid];
      else day.att[sid] = Object.assign({type}, type === '출석인정' ? {} : {reason}, $('#mNote', m).value.trim() ? {note:$('#mNote', m).value.trim()} : {});
      closeModal(); save(); render();
    };
  });
}

function attGrid(date){
  const list = students(), att = dayOf(date).att || {};
  const counts = {}; for(const a of Object.values(att)) if(a) counts[a.type] = (counts[a.type] || 0) + 1;
  return `<div class="attsum">
      <span class="pill">재적 ${list.length}</span>
      <span class="pill ok">출석 ${list.length - (counts['결석'] || 0)}</span>
      ${[...TYPES,'출석인정'].filter(t => counts[t]).map(t => `<span class="pill t-${t}">${t} ${counts[t]}</span>`).join('')}
    </div>`;
}
/* ---------- 누가기록 ---------- */
function recItem(r, showStudent){
  return `<li><div class="meta">${esc(shortDate(r.date))}</div>
    <div class="txt">${showStudent ? `<b>${esc(stuLabel(stuById(r.sid)))}</b> ` : ''}<span class="tag">${esc(r.cat)}</span>${esc(r.text)}</div>
    <button class="btn sm ghost danger" data-delrec="${esc(r.id)}" aria-label="기록 지우기">지우기</button></li>`;
}
function recForm(opts){
  const sel = opts.sid ? '' : `<select data-rf="sid" aria-label="학생"><option value="">학생 선택</option>${students().map(s => `<option value="${esc(s.id)}">${esc(stuLabel(s))}</option>`).join('')}</select>`;
  const date = opts.date ? '' : `<input type="date" data-rf="date" value="${TODAY}" aria-label="날짜">`;
  return `<div class="addrec ${opts.sid ? 'wide' : ''}">${sel}${date}
    <select data-rf="cat" aria-label="영역">${CATS.map(c => `<option>${c}</option>`).join('')}</select>
    <input type="text" data-rf="text" placeholder="관찰·상담 내용을 적고 Enter" maxlength="1000">
    <button class="btn primary" data-addrec>기록 추가</button></div>`;
}
function bindRecForm(root, opts){
  const add = () => {
    const sid = opts.sid || $('[data-rf=sid]', root)?.value;
    const date = opts.date || $('[data-rf=date]', root)?.value || TODAY;
    const text = $('[data-rf=text]', root).value.trim();
    if(!sid){ alert('학생을 선택해 주세요.'); return; }
    if(!text){ $('[data-rf=text]', root).focus(); return; }
    state.records.push({id:uid(), sid, date, cat:$('[data-rf=cat]', root).value, text});
    save(); render();
    $(`#view-${view} [data-rf=text]`)?.focus();
  };
  const btn = $('[data-addrec]', root); if(btn) btn.onclick = add;
  const t = $('[data-rf=text]', root); if(t) t.onkeydown = e => { if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); add(); } };
}

});
$('#view-log').addEventListener('change', e => {
  if(e.target.id === 'logDate' && e.target.value){ logDate = e.target.value; renderLog(); return; }
  if(e.target.dataset.f === 'holiday' || e.target.dataset.f === 'weather'){
    dayW(logDate)[e.target.dataset.f] = e.target.type === 'checkbox' ? e.target.checked : e.target.value; save();
  }
});
$('#view-log').addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.f && t.dataset.f !== 'holiday' && t.dataset.f !== 'weather'){ dayW(logDate)[t.dataset.f] = t.value; save(); return; }
  if(t.dataset.p !== undefined){
    const i = Number(t.dataset.p), day = dayW(logDate);
    day.periods ||= [];
    while(day.periods.length <= i) day.periods.push(null);
    const p = day.periods[i] || (day.periods[i] = {});
    const base = baseSubjects(logDate)[i] || '';
    if(t.dataset.k === 'subj') { if(t.value === base) delete p.subj; else p.subj = t.value; }
    else { if(t.value) p.content = t.value; else delete p.content; }
    if(!Object.keys(p).length) day.periods[i] = null;
    save();
  }
});

function monthShift(m, n){ const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo-1+n, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }
function monthDays(m){ const [y, mo] = m.split('-').map(Number); const n = new Date(y, mo, 0).getDate(); return Array.from({length:n}, (_, i) => `${m}-${pad(i+1)}`); }
function renderCal(){

  el.innerHTML = `
  <div class="monthbar">
    <button class="btn" data-m="-1" aria-label="이전 달">◀</button>
    <h2>${y}년 ${mo}월</h2>

  </div>
  <div class="cal">
    ${WEEK.map(w => `<div class="hd">${w}</div>`).join('')}
    ${'<div class="cell blank"></div>'.repeat(first)}
    ${days.map(d => {
      const day = dayOf(d), dow = parseD(d).getDay();
      const att = Object.values(day.att || {}).filter(Boolean);
      const c = {}; att.forEach(a => c[a.type] = (c[a.type] || 0) + 1);
      const ab = TYPES.filter(t => c[t]).map(t => SHORT[t] + c[t]).join(' ');
      const memo = [day.guide, day.memo, day.notice].find(Boolean) || '';
      return `<button class="cell d${dow} ${day.holiday ? 'hol' : ''} ${d === TODAY ? 'today' : ''}" data-day="${d}">
        <span class="n">${Number(d.slice(8))}</span>
        ${day.event ? `<span class="ev">${esc(day.event)}</span>` : day.holiday ? '<span class="ev">휴업일</span>' : ''}
        ${ab ? `<span class="ab">${esc(ab)}</span>` : ''}

    : '<p class="muted small">아직 학생이 없습니다. 아래 «학생 추가 · 정보»에서 한 명씩 추가하거나 엑셀 내용을 붙여넣으세요.</p>'}

$('#view-roster').addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.ck){
    const sid = t.closest('tr').dataset.sid, m = state.checks.marks[t.dataset.ck] ||= {};
    if(t.checked) m[sid] = true; else delete m[sid];
    const col = state.checks.cols.find(c => c.id === t.dataset.ck);
    const cell = $(`[data-cnt="${t.dataset.ck}"]`); if(cell && col) cell.textContent = `${checkCount(col)}/${students().length}`;
    save();
  }
});
$('#view-roster').addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.colt){ const c = state.checks.cols.find(x => x.id === t.dataset.colt); if(c){ c.title = t.value; save(); } }
});
$('#view-roster').addEventListener('click', e => {
  const t = e.target;
  if(t.id === 'addCol'){
    state.checks.cols.push({id:uid(), title:''});
    save(); renderRoster();
    $$('#view-roster [data-colt]').at(-1)?.focus();
    return;
  }
  const d = t.closest('[data-delcol]');
  if(d){
    const c = state.checks.cols.find(x => x.id === d.dataset.delcol); if(!c) return;
    const n = checkCount(c);
    if(n && !confirm(`«${c.title || '항목'}» 항목과 체크 ${n}개를 지울까요?`)) return;
    state.checks.cols = state.checks.cols.filter(x => x !== c);
    delete state.checks.marks[c.id];
    save(); renderRoster();
  }
});
$('#view-roster').addEventListener('input', e => {
  const t = e.target;
  if(!t.dataset.s) return;
  const s = stuById(t.closest('tr').dataset.sid); if(!s) return;
  s[t.dataset.s] = t.dataset.s === 'no' ? (t.value ? Number(t.value) : '') : t.value; save();
});
$('#view-roster').addEventListener('change', e => { if(e.target.dataset.s === 'no') renderRoster(); });
$('#view-roster').addEventListener('click', e => {
  const t = e.target;
  if(t.id === 'addStu'){
    const no = Math.max(0, ...state.students.map(s => Number(s.no) || 0)) + 1;
    state.students.push({id:uid(), no, name:'', gender:'', phone:'', note:''});
    save(); renderRoster();
    $('#stuInfo').open = true; $$('#view-roster table.roster input[data-s=name]').find(x => !x.value)?.focus();
    return;
  }
  if(t.closest('[data-delstu]')){
    const sid = t.closest('tr').dataset.sid, s = stuById(sid);
    const n = state.records.filter(r => r.sid === sid).length;
    if(!confirm(`${stuLabel(s)} 학생을 명렬표에서 지울까요?\n이 학생의 출결·평가·누가기록${n ? '(' + n + '건)' : ''}도 함께 지워집니다.`)) return;
    state.students = state.students.filter(x => x.id !== sid);
    state.records = state.records.filter(r => r.sid !== sid);
    for(const day of Object.values(state.days)) if(day.att) delete day.att[sid];
    for(const ev of state.evals) if(ev.marks) delete ev.marks[sid];
    for(const m of Object.values(state.checks.marks)) delete m[sid];
    save(); renderRoster(); return;
  }
  if(t.id === 'applyRoster'){
    const rows = $('#pasteRoster').value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    let added = 0, changed = 0;
    for(const line of rows){
      const parts = line.split(/\t|,|\s+/).filter(Boolean);
      let no = '', name = '', gender = '';
      for(const p of parts){
        if(!no && /^\d+$/.test(p)) no = Number(p);
        else if(!gender && /^(남|여|남자|여자|M|F)$/i.test(p)) gender = /^(여|여자|F)$/i.test(p) ? '여' : '남';
        else if(!name && /[가-힣A-Za-z]/.test(p)) name = p;
      }
      if(!name) continue;
      const ex = no && state.students.find(s => Number(s.no) === no);
      if(ex){ ex.name = name; if(gender) ex.gender = gender; changed++; }
      else { state.students.push({id:uid(), no:no || '', name, gender, phone:'', note:''}); added++; }
    }
    save(); renderRoster();
    alert(`${added}명 추가, ${changed}명 수정했습니다.`);
  }
});

/* ---------- 평가 ---------- */
const SCALES = {'3단계':['잘함','보통','노력요함'], '4단계':['매우잘함','잘함','보통','노력요함'], '상중하':['상','중','하'], '점수':null};
const SUBJECTS = ['국어','수학','사회','과학','영어','도덕','체육','음악','미술','실과','바른 생활','슬기로운 생활','즐거운 생활','창의적 체험활동'];
let curEval = '';
const markOf = (ev, sid) => ev.marks?.[sid] || {};
const hasMark = m => m.v !== undefined && m.v !== '';
function renderEval(){
  const el = $('#view-eval');
  const list = students();
  const evals = [...state.evals].sort((a,b) => (b.date || '').localeCompare(a.date || ''));
  if(!evals.find(x => x.id === curEval)) curEval = evals[0]?.id || '';
  const ev = evals.find(x => x.id === curEval);
  $('#printHead').textContent = headline() + (ev ? ` · ${ev.subject || ''} ${ev.title || ''} 평가` : ' 평가');
  el.innerHTML = `
  <div class="pagehead"><h2>평가</h2><span class="sp"></span><button class="btn primary noprint" id="newEval">평가 추가</button></div>
  ${!list.length ? noStudents() : !evals.length ? `<div class="card"><p class="muted">«평가 추가»로 과목·평가 영역·척도를 정하면 학생별 결과와 관찰 내용을 적을 수 있습니다.</p></div>` : `
  <div class="sidelayout">
    <div class="card sidelist">${evals.map(x => `<button class="${x.id === curEval ? 'on' : ''}" data-ev="${esc(x.id)}">
      <b>${esc(x.subject ? x.subject + ' · ' : '')}${esc(x.title || '(제목 없음)')}</b>
      <small>${esc(x.date ? shortDate(x.date) + ' · ' : '')}${esc(x.scale)} · ${list.filter(s => hasMark(markOf(x, s.id))).length}/${list.length}명</small></button>`).join('')}</div>
    <div class="card">${evalBody(ev, list)}</div>
  </div>`}`;
}
function evalDist(ev, list){
  const levels = SCALES[ev.scale];
  const marked = list.map(s => markOf(ev, s.id)).filter(hasMark);
  if(levels) return levels.map(l => `<span class="pill">${esc(l)} ${marked.filter(m => m.v === l).length}</span>`).join('') + `<span class="pill">미입력 ${list.length - marked.length}</span>`;
  const nums = marked.map(m => Number(m.v)).filter(n => !isNaN(n));
  return nums.length ? `<span class="pill">평균 ${(nums.reduce((a,b) => a+b, 0) / nums.length).toFixed(1)}</span><span class="pill">최고 ${Math.max(...nums)}</span><span class="pill">최저 ${Math.min(...nums)}</span><span class="pill">미입력 ${list.length - nums.length}</span>` : '<span class="pill">미입력</span>';
}
function evalBody(ev, list){
  const levels = SCALES[ev.scale];
  return `
  <div class="row" style="justify-content:space-between;align-items:flex-start">
    <div><h3 style="margin:0;font-size:18px">${esc(ev.subject ? ev.subject + ' · ' : '')}${esc(ev.title || '(제목 없음)')}</h3>
      <div class="muted small">${esc(ev.date ? korDate(ev.date) : '')} · ${esc(ev.scale)}</div></div>
    <div class="row noprint"><button class="btn sm" id="evEdit">수정</button><button class="btn sm" id="evCsv">CSV</button><button class="btn sm" onclick="print()">인쇄</button><button class="btn sm danger" id="evDel">삭제</button></div>
  </div>
  ${ev.criteria ? `<p class="small crit">${esc(ev.criteria)}</p>` : ''}
  <div class="row" id="evDist" style="margin:10px 0">${evalDist(ev, list)}</div>
  <div class="tablewrap"><table class="tt evt"><thead><tr><th style="text-align:center">번호</th><th>이름</th><th>결과</th><th>관찰 내용</th></tr></thead><tbody>
  ${list.map(s => { const m = markOf(ev, s.id); return `<tr>
    <td class="p">${esc(s.no || '')}</td><td class="enm">${esc(s.name)}</td>
    <td class="lv">${levels ? `<div class="row" style="gap:4px;flex-wrap:nowrap">${levels.map(l => `<button class="btn sm ${m.v === l ? 'on' : ''}" data-lv="${esc(l)}" data-s="${esc(s.id)}">${esc(l)}</button>`).join('')}</div>`
      : `<input type="number" data-score data-s="${esc(s.id)}" value="${esc(m.v ?? '')}" style="width:90px" aria-label="${esc(s.name)} 점수">`}</td>
    <td><input type="text" data-enote data-s="${esc(s.id)}" value="${esc(m.note || '')}" maxlength="500" aria-label="${esc(s.name)} 관찰 내용"></td></tr>`; }).join('')}
  </tbody></table></div>`;
}
function openEvalModal(ev){
  const isNew = !ev;
  ev = ev || {subject:'', title:'', date:TODAY, scale:'3단계', criteria:''};
  openModal(`
    <h3>${isNew ? '평가 추가' : '평가 수정'}</h3>
    <div class="grp"><div>과목</div><input type="text" id="eSubj" list="subjList" value="${esc(ev.subject)}" maxlength="30" autofocus>
      <datalist id="subjList">${SUBJECTS.map(s => `<option value="${esc(s)}">`).join('')}</datalist></div>
    <div class="grp"><div>평가 영역 · 제목</div><input type="text" id="eTitle" value="${esc(ev.title)}" maxlength="80" placeholder="예: 분수의 덧셈 수행평가"></div>
    <div class="grp"><div>날짜</div><input type="date" id="eDate" value="${esc(ev.date)}"></div>
    <div class="grp"><div>척도</div><div class="row" id="eScale">${Object.keys(SCALES).map(k => `<button class="btn ${ev.scale === k ? 'on' : ''}" data-sc="${k}">${k === '점수' ? '점수' : SCALES[k].join('·')}</button>`).join('')}</div></div>
    <div class="grp"><div>성취기준 · 평가 요소 <span class="muted">(선택)</span></div><textarea id="eCrit" maxlength="1000">${esc(ev.criteria)}</textarea></div>
    <div class="acts"><button class="btn ghost" data-close>취소</button><button class="btn primary" id="eSave">저장</button></div>`,
  m => {
    let scale = ev.scale;
    $('#eScale', m).onclick = e => { const b = e.target.closest('button'); if(!b) return; scale = b.dataset.sc; $$('#eScale button', m).forEach(x => x.classList.toggle('on', x === b)); };
    $('[data-close]', m).onclick = closeModal;
    $('#eSave', m).onclick = () => {
      const title = $('#eTitle', m).value.trim(), subject = $('#eSubj', m).value.trim();
      if(!title && !subject){ $('#eTitle', m).focus(); return; }
      if(!isNew && scale !== ev.scale && Object.keys(ev.marks || {}).length && !confirm('척도를 바꾸면 입력한 결과가 맞지 않을 수 있습니다. 결과를 지우고 바꿀까요? (관찰 내용은 남습니다)')) return;
      const target = isNew ? {id:uid(), marks:{}} : ev;
      if(!isNew && scale !== ev.scale) for(const k of Object.keys(target.marks || {})) delete target.marks[k].v;
      Object.assign(target, {subject, title, date:$('#eDate', m).value, scale, criteria:$('#eCrit', m).value.trim()});
      if(isNew) state.evals.push(target);
      curEval = target.id;
      closeModal(); save(); renderEval();
    };
  });
}
function setMark(sid, key, value){
  const ev = state.evals.find(x => x.id === curEval); if(!ev) return;
  ev.marks ||= {};
  const m = ev.marks[sid] ||= {};
  if(value === '' || value === undefined) delete m[key]; else m[key] = value;
  if(!Object.keys(m).length) delete ev.marks[sid];
  save();
  $('#evDist').innerHTML = evalDist(ev, students());
}
$('#view-eval').addEventListener('click', e => {
  const t = e.target;
  if(t.id === 'newEval'){ openEvalModal(); return; }
  const b = t.closest('[data-ev]'); if(b){ curEval = b.dataset.ev; renderEval(); return; }
  const lv = t.closest('[data-lv]');
  if(lv){
    const ev = state.evals.find(x => x.id === curEval);
    const same = markOf(ev, lv.dataset.s).v === lv.dataset.lv;
    setMark(lv.dataset.s, 'v', same ? '' : lv.dataset.lv);
    $$(`[data-lv][data-s="${lv.dataset.s}"]`).forEach(x => x.classList.toggle('on', !same && x === lv));
    return;
  }
  const ev = state.evals.find(x => x.id === curEval); if(!ev) return;
  if(t.id === 'evEdit') openEvalModal(ev);
  if(t.id === 'evDel' && confirm(`«${ev.title || ev.subject}» 평가와 입력한 결과를 지울까요?`)){ state.evals = state.evals.filter(x => x !== ev); save(); renderEval(); }
  if(t.id === 'evCsv'){
    const rows = [['과목', ev.subject], ['평가', ev.title], ['날짜', ev.date], ['척도', ev.scale], [], ['번호','이름','결과','관찰 내용']];
    students().forEach(s => { const m = markOf(ev, s.id); rows.push([s.no, s.name, m.v ?? '', m.note || '']); });
    download(`학급일지-평가-${ev.subject || ''}-${ev.title || ''}.csv`, csv(rows), 'text/csv;charset=utf-8');
  }
});
$('#view-eval').addEventListener('input', e => {
  const t = e.target;
  if(t.hasAttribute('data-score')) setMark(t.dataset.s, 'v', t.value === '' ? '' : Number(t.value));
  if(t.hasAttribute('data-enote')) setMark(t.dataset.s, 'note', t.value);
});

  <div class="card">
    <h3>사용 내역 <span class="muted">${items.length}건</span></h3>
    ${items.length ? `<div class="tablewrap"><table class="tt budt"><thead><tr><th>날짜</th><th>구분</th><th>내용</th><th class="amt">금액</th><th>비고</th><th></th></tr></thead><tbody>
      ${items.map(i => `<tr><td>${esc(i.date)}</td><td>${esc(i.cat)}</td><td>${esc(i.item)}</td><td class="amt">${won(i.amount)}</td><td class="muted">${esc(i.note || '')}</td>
        <td class="x"><button class="btn sm ghost danger noprint" data-delbud="${esc(i.id)}">지우기</button></td></tr>`).join('')}
      <tr class="tot"><td colspan="3"><b>합계</b></td><td class="amt"><b>${won(used)}</b></td><td colspan="2"></td></tr>
    </tbody></table></div>` : '<p class="muted small">아직 사용 내역이 없습니다.</p>'}
  </div>`;
}
function addBudget(){
  const amount = Number($('#bAmt').value), item = $('#bItem').value.trim();
  if(!item){ $('#bItem').focus(); return; }
  if(!amount){ $('#bAmt').focus(); return; }
  state.budget.items.push({id:uid(), date:$('#bDate').value || TODAY, cat:$('#bCat').value, item, amount, note:$('#bNote').value.trim()});
  save(); renderBudget(); $('#bItem').focus();
}
$('#view-budget').addEventListener('click', e => {
  const t = e.target;
  if(t.id === 'bAdd') addBudget();
  if(t.id === 'budCsv'){
    const rows = [['날짜','구분','내용','금액','비고']];
    [...state.budget.items].sort((a,b) => a.date < b.date ? -1 : 1).forEach(i => rows.push([i.date, i.cat, i.item, i.amount, i.note || '']));
    rows.push([], ['예산 총액','','',state.budget.total || 0], ['사용','','',state.budget.items.reduce((s,i) => s + (Number(i.amount) || 0), 0)]);
    download(`학급일지-예산사용-${TODAY}.csv`, csv(rows), 'text/csv;charset=utf-8');
  }
  const d = t.closest('[data-delbud]');
  if(d && confirm('이 사용 내역을 지울까요?')){ state.budget.items = state.budget.items.filter(i => i.id !== d.dataset.delbud); save(); renderBudget(); }
});
$('#view-budget').addEventListener('keydown', e => { if(e.key === 'Enter' && !e.isComposing && ['bItem','bAmt','bNote'].includes(e.target.id)){ e.preventDefault(); addBudget(); } });
$('#view-budget').addEventListener('change', e => { if(e.target.id === 'budTotal'){ state.budget.total = Number(e.target.value) || 0; save(); renderBudget(); } });

/* ---------- 메모 ---------- */
let memoQ = '';
const stamp = () => { const d = new Date(); return `${ymd(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function renderMemo(){
  const el = $('#view-memo');
  const q = memoQ.trim();
  const memos = state.memos.filter(m => !q || `${m.title} ${m.text}`.includes(q))
    .sort((a,b) => (b.pin ? 1 : 0) - (a.pin ? 1 : 0) || (b.created || '').localeCompare(a.created || ''));
  $('#printHead').textContent = headline() + ' 메모';
  el.innerHTML = `
  <div class="pagehead"><h2>메모</h2><input type="text" id="memoQ" class="noprint" placeholder="메모 검색" value="${esc(memoQ)}" aria-label="메모 검색"><span class="sp"></span><button class="btn primary noprint" id="newMemo">새 메모</button></div>
  ${memos.length ? `<div class="memogrid">${memos.map(m => `<div class="card memo ${m.pin ? 'pin' : ''}" data-mid="${esc(m.id)}">
    <div class="row" style="flex-wrap:nowrap"><input type="text" class="mt" data-mf="title" value="${esc(m.title)}" placeholder="제목" maxlength="80" aria-label="메모 제목">
      <button class="btn sm ghost noprint ${m.pin ? 'on' : ''}" data-mpin title="위에 고정">${m.pin ? '고정됨' : '고정'}</button>
      <button class="btn sm ghost danger noprint" data-mdel>지우기</button></div>
    <textarea data-mf="text" placeholder="내용" maxlength="20000" aria-label="메모 내용">${esc(m.text)}</textarea>
    <small class="muted">${esc(m.updated || '')}</small></div>`).join('')}</div>`
  : `<div class="card"><p class="muted">${q ? '검색 결과가 없습니다.' : '학급 운영 아이디어, 회의 내용, 할 일 등을 자유롭게 적어 두세요.'}</p></div>`}`;
}
$('#view-memo').addEventListener('click', e => {
  const t = e.target;
  if(t.id === 'newMemo'){
    const now = stamp();
    state.memos.push({id:uid(), title:'', text:'', pin:false, created:now, updated:now});
    memoQ = ''; save(); renderMemo(); $('#view-memo .memo .mt')?.focus(); return;
  }
  const card = t.closest('[data-mid]'); if(!card) return;
  const m = state.memos.find(x => x.id === card.dataset.mid); if(!m) return;
  if(t.closest('[data-mpin]')){ m.pin = !m.pin; save(); renderMemo(); }
  if(t.closest('[data-mdel]') && (!(m.title || m.text) || confirm('이 메모를 지울까요?'))){ state.memos = state.memos.filter(x => x !== m); save(); renderMemo(); }
});
$('#view-memo').addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'memoQ'){ memoQ = t.value; renderMemo(); const q = $('#memoQ'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); return; }
  const card = t.closest('[data-mid]'); if(!card || !t.dataset.mf) return;
  const m = state.memos.find(x => x.id === card.dataset.mid); if(!m) return;
  m[t.dataset.mf] = t.value; m.updated = stamp();
  $('small', card).textContent = m.updated;
  save();
});

/* ---------- 설정 ---------- */

  const el = $('#view-setup');
  const i = state.info;
  $('#printHead').textContent = '';
  let legacy = false;
  try{ legacy = window.HRCloud?.active && !!localStorage.getItem(LSKEY); }catch(e){}
  el.innerHTML = `
  <div class="pagehead"><h2>설정</h2></div>
  <div class="card">
    <h3>학급 정보</h3>
    <div class="form">
      <label class="f">학년도<input type="number" data-i="year" value="${esc(i.year)}" min="2000" max="2100"></label>
      <label class="f">학교<input type="text" data-i="school" value="${esc(i.school)}" maxlength="40"></label>
      <label class="f">학년<input type="text" data-i="grade" value="${esc(i.grade)}" maxlength="4" inputmode="numeric"></label>
      <label class="f">반<input type="text" data-i="cls" value="${esc(i.cls)}" maxlength="6"></label>

    <div class="row" style="margin-bottom:8px"><label class="chk">하루 교시 수
      <select id="periods">${[4,5,6,7,8].map(n => `<option ${state.periods === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label></div>
    <div class="tablewrap"><table class="base"><thead><tr><th>교시</th>${[1,2,3,4,5].map(w => `<th>${WEEK[w]}</th>`).join('')}</tr></thead><tbody>
    ${Array.from({length:state.periods}, (_, p) => `<tr><th>${p+1}</th>${[1,2,3,4,5].map(w => `<td><input type="text" data-tw="${w}" data-tp="${p}" value="${esc(state.timetable[w]?.[p] || '')}" maxlength="20" aria-label="${WEEK[w]}요일 ${p+1}교시"></td>`).join('')}</tr>`).join('')}
    </tbody></table></div>
  </div>

    <h3>데이터</h3>
    <p class="muted small" style="margin-bottom:10px">로그인하면 학생 이름을 포함한 학급일지가 내 Google 계정의 온라인 저장소에 저장됩니다. 로그인하지 않으면 이 브라우저에만 저장됩니다.</p>
    <div class="row">
      <button class="btn" id="expBackup">백업 파일 내보내기</button>

      <button class="btn" id="expRec">누가기록 CSV</button>
      <button class="btn" id="cloudMigrate" ${legacy ? '' : 'hidden'}>이 기기의 기존 일지 가져오기</button>
    </div>
    <p class="muted small" style="margin-top:12px">앱 버전 ${APP_VER}</p>

  const mig = $('#cloudMigrate', el);

$('#view-setup').addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.i){ state.info[t.dataset.i] = t.dataset.i === 'year' ? (Number(t.value) || schoolYearOf(TODAY)) : t.value; save(); updateClassLabel(); return; }
  if(t.dataset.tw){
    const w = t.dataset.tw, p = Number(t.dataset.tp);
    const arr = state.timetable[w] ||= [];
    while(arr.length <= p) arr.push('');
    arr[p] = t.value.trim();
    save();
  }
});
$('#view-setup').addEventListener('change', e => {
  if(e.target.id === 'periods'){ state.periods = Number(e.target.value); save(); renderSetup(); }
  if(e.target.id === 'impBackup' && e.target.files[0]) importBackup(e.target.files[0]);
});
$('#view-setup').addEventListener('click', e => {
  const t = e.target;
  if(t.id === 'expBackup') exportBackup();
  if(t.id === 'expAtt') exportAttCsv(true);
  if(t.id === 'expRec') exportRecCsv();
});

/* ---------- 내보내기 ---------- */
function download(name, text, type){
  const blob = new Blob([text], {type});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const csvCell = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
const csv = rows => '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
function exportBackup(){ download(`학급일지-백업-${TODAY}.json`, journalPayload(), 'application/json'); }
function importBackup(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const o = JSON.parse(r.result);
      if(!o || (o.app !== 'homeroom' && !o.students)) throw new Error();
      if(!confirm('백업 파일의 내용으로 지금 일지를 교체합니다. 계속할까요?')) return;
      state = normalize(o.app === 'homeroom' ? o.state : o);
      save(); render();
      alert('백업을 불러왔습니다.');
    }catch(e){ alert('학급일지 백업 파일이 아닙니다.'); }
  };
  r.readAsText(file);
}
function exportAttCsv(wholeYear){
  let from, to, label;
  if(wholeYear){ const y = Number(state.info.year); [from, to] = syRange(y); label = `${y}학년도`; }
  else { from = attMonth + '-01'; to = attMonth + '-31'; label = attMonth; }
  const rows = [['날짜','요일','번호','이름','구분','사유','메모']];
  Object.keys(state.days).filter(d => inRange(d, from, to)).sort().forEach(d => {
    const att = state.days[d].att || {};
    students().forEach(s => { const a = att[s.id]; if(a) rows.push([d, WEEK[parseD(d).getDay()], s.no, s.name, a.type, a.reason || '', a.note || '']); });
  });
  download(`학급일지-출결-${label}.csv`, csv(rows), 'text/csv;charset=utf-8');
}
function exportRecCsv(){
  const rows = [['날짜','번호','이름','영역','내용']];
  [...state.records].sort((a,b) => a.date < b.date ? -1 : 1).forEach(r => { const s = stuById(r.sid); rows.push([r.date, s?.no || '', s?.name || '', r.cat, r.text]); });
  download(`학급일지-누가기록-${TODAY}.csv`, csv(rows), 'text/csv;charset=utf-8');
}

/* ---------- 계정 연결 ---------- */
function refreshJournal(){
  clearTimeout(saveTimer);
  closeModal();
  curStu = '*'; curEval = ''; memoQ = '';
  render();
}
window.HRJournal = {
  localKey: LSKEY,
  get: () => journalPayload(),
  empty: () => JSON.stringify({app:'homeroom', version:1, state:defState()}),
  replace: payload => { state = readPayload(payload); refreshJournal(); },
  showLocal: () => { state = load(); refreshJournal(); },
  backup: exportBackup,
  status: setSaveState,
  flushLocal: flush
};

(function init(){
  render();
  setSaveState(STORAGE === 'ok' ? '저장됨' : '저장 안 됨', STORAGE !== 'ok');
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(reg => {
      reg.update().catch(() => {});
      setInterval(() => reg.update().catch(() => {}), 60*60*1000);
    }).catch(() => {});
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if(reloaded) return; reloaded = true; location.reload(); });
  }
})();
</script>
